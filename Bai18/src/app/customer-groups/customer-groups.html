<div class="notice" *ngIf="loading">Đang tải dữ liệu khách hàng…</div><div class="notice error" *ngIf="error">{{error}}</div>
<section *ngFor="let group of groups; trackBy: trackGroup"><div class="group-head"><div><span>Nhóm {{group.CustomerTypeId}}</span><h2>{{group.CustomterTypeName}}</h2></div><b>{{group.Customers.length | number:'2.0'}} thành viên</b></div><div class="cards"><article *ngFor="let customer of group.Customers"><img [src]="customer.Image" [alt]="customer.Name"><div class="info"><div class="top"><span>{{customer.Id}}</span><em>{{customer.Age}} tuổi</em></div><h3>{{customer.Name}}</h3><a [href]="'mailto:'+customer.Email">{{customer.Email}}</a></div></article></div></section>
