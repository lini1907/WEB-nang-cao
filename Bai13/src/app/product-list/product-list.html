<section class="panel"><div class="title"><div><span>03 sản phẩm</span><h2>Danh sách sản phẩm</h2></div><p>Chọn “Chi tiết” để xem đầy đủ thông tin.</p></div>
<div class="table-wrap"><table><thead><tr><th>Mã sản phẩm</th><th>Tên sản phẩm</th><th>Giá</th><th>Hình ảnh</th><th></th></tr></thead><tbody><tr *ngFor="let p of products"><td><b>{{p.ProductId}}</b></td><td>{{p.ProductName}}</td><td><span class="price">{{p.Price | number}} ₫</span></td><td><img [src]="p.Image" [alt]="p.ProductName"></td><td><button (click)="viewDetail(p)">Chi tiết <span>→</span></button></td></tr></tbody></table></div></section>
