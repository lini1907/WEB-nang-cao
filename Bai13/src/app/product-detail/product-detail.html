<button class="back" (click)="goBack()">← Quay lại danh sách</button><article *ngIf="selectedProduct as p; else notFound"><div class="visual"><img [src]="p.Image" [alt]="p.ProductName"></div><div class="info"><span class="code">{{p.ProductId}}</span><h2>{{p.ProductName}}</h2><p>{{p.Description}}</p><div class="label">Giá sản phẩm</div><strong>{{p.Price | number}} ₫</strong><button class="primary" (click)="goBack()">Tiếp tục xem sản phẩm</button></div></article><ng-template #notFound><div class="empty"><h2>Không tìm thấy sản phẩm</h2><button (click)="goBack()">Về danh sách</button></div></ng-template>
