<section class="category" *ngFor="let category of categories"><div class="category-head"><div><small>{{category.Cateid}}</small><h2>{{category.CateName}}</h2></div><span>{{category.Products.length}} sản phẩm</span></div><div class="grid"><article *ngFor="let product of category.Products"><div class="image"><img [src]="product.Image" [alt]="product.ProductName"><span>{{product.ProductId}}</span></div><div class="content"><h3>{{product.ProductName}}</h3><p>Giá sản phẩm</p><strong>{{product.Price | number}} ₫</strong></div></article></div></section>
